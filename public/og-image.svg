<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
    <title id="title">NEXO CLUB — Gestión deportiva</title>
    <desc id="description">La plataforma para conectar deportistas, familias y administradores.</desc>
    <defs>
        <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#B8F34B" stop-opacity=".18"/>
            <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
        </linearGradient>
    </defs>
    <rect width="1200" height="630" fill="#0B1220"/>
    <circle cx="1040" cy="-20" r="420" fill="url(#glow)"/>
    <rect x="92" y="122" width="190" height="190" rx="42" fill="#B8F34B"/>
    <path d="M136 166h29l31 47 31-47h18v102h-29v-52l-11 17h-18l-11-17v52h-40V166Z" fill="#0B1220"/>
