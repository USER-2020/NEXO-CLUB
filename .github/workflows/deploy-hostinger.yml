name: Release NEXO CLUB

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  package:
    name: Package release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_meta.outputs.release_tag }}
      target_sha: ${{ steps.release_meta.outputs.target_sha }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set release metadata
        id: release_meta
        shell: bash
        env:
          TARGET_SHA_INPUT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "target_sha=$TARGET_SHA_INPUT" >> "$GITHUB_OUTPUT"
          echo "release_tag=deploy-$TARGET_SHA_INPUT" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Create release package
        run: |
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='tests' \
              --exclude='storage/logs/*' \
              --exclude='storage/framework/cache/data/*' \
              --exclude='storage/framework/sessions/*' \
              --exclude='storage/framework/views/*' \
              --exclude='database/database.sqlite' \
              --exclude='.env' \
              -czf release.tar.gz .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexo-club-release
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 3

  create-release:
    name: Create GitHub tag and release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.package.outputs.target_sha }}
          fetch-depth: 0

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: nexo-club-release

      - name: Create deployment tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          TARGET_SHA: ${{ needs.package.outputs.target_sha }}
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG" "$TARGET_SHA"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" release.tar.gz \
            --title "NEXO CLUB $RELEASE_TAG" \
            --notes "Release generado automáticamente desde CI para el commit $TARGET_SHA."

