name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          mkdir -p database
          touch database/database.sqlite

      - name: Validate platform versions
        run: |
          php -v
          composer --version
          node --version
          npm --version
          php artisan --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Run migrations
        run: php artisan migrate --force --ansi

      - name: Run backend tests
        run: php artisan test --ansi

      - name: Build frontend
        run: npm run build
